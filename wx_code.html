<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WX_CODE 葵花码 Studio · 编码 / 解码</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e8eaed; --dim:#9aa0aa;
          --accent:#4c9aff; --ok:#37d67a; --err:#ff5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:baseline; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  header span { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:18px; padding:18px 22px 40px; max-width:1400px; margin:0 auto; }
  @media (max-width:980px) { main { grid-template-columns:1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
  h2 { font-size:14px; margin:0 0 12px; color:var(--accent); font-weight:600; letter-spacing:.02em; }
  textarea, input[type=text] { width:100%; background:#0d0f14; color:var(--fg); border:1px solid var(--line);
        border-radius:8px; padding:10px; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; resize:vertical; }
  textarea { min-height:74px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  button { background:#22283a; color:var(--fg); border:1px solid var(--line); border-radius:8px;
           padding:8px 14px; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#06121f; font-weight:600; }
  label.mini { color:var(--dim); font-size:12px; }
  select { background:#0d0f14; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-size:13px; }
  .preview { display:flex; justify-content:center; padding:14px 0 6px; }
  .preview { align-items:center; }
  .preview .frame { width:min(360px,100%); aspect-ratio:1/1; background:#fff; border-radius:10px; overflow:hidden; }
  .preview svg, .preview canvas { display:block; width:100%; height:100%; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:6px 12px; font:12px/1.6 ui-monospace,Menlo,monospace;
        margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .kv .k { color:var(--dim); }
  .kv .v { color:var(--fg); word-break:break-all; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  #drop { border:1.5px dashed var(--line); border-radius:10px; padding:18px; text-align:center; color:var(--dim);
          cursor:pointer; font-size:13px; }
  #drop.hot { border-color:var(--accent); color:var(--accent); }
  pre { background:#0d0f14; border:1px solid var(--line); border-radius:8px; padding:10px;
        font:12px/1.5 ui-monospace,Menlo,monospace; overflow:auto; max-height:220px; white-space:pre-wrap; }
  .hint { color:var(--dim); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>WX_CODE 葵花码 Studio</h1>
  <span>编码器 / 解码器 · 纯前端</span>
</header>
<main>
  <section>
    <h2>① 生成葵花码</h2>
    <textarea id="payload" placeholder="输入链接或文本，例如 https://example.com/">https://example.com/</textarea>
    <div class="row">
      <button class="primary" id="btnEnc">生成</button>
      <label class="mini">版本</label>
      <select id="optVersion">
        <option value="3" selected>自动</option><option value="0">v0</option>
        <option value="1">v1</option><option value="2">v2</option>
      </select>
      <label class="mini">纠错≥</label>
      <select id="optLevel"><option value="0" selected>L</option><option value="1">M</option>
        <option value="2">Q</option><option value="3">H</option></select>
      <button id="btnSvg">下载 SVG</button>
      <button id="btnPng">下载 PNG</button>
    </div>
    <div class="row">
      <label class="mini">中心图</label>
      <input type="file" id="logoFile" accept="image/*" style="display:none">
      <button id="btnLogo">上传图片 / GIF</button>
      <button id="btnLogoClear">清除</button>
      <span class="hint" id="logoHint">未设置（可选，会盖在中心，圆形裁剪）</span>
    </div>
    <div class="preview"><div class="frame" id="encPrev"></div></div>
    <div class="kv" id="encInfo"></div>
    <p class="hint">提示：载荷 ≤ 58 个 URL 字符 / ≤ 44 字节；超出会自动提示容量不足。</p>
  </section>

  <section>
    <h2>② 解码图片</h2>
    <div id="drop">点击或拖入葵花码图片（PNG / JPG / WebP…）</div>
    <div class="row">
      <input type="file" id="file" accept="image/*" style="display:none">
      <button id="btnDemo">载入示例</button>
    </div>
    <div class="preview"><div class="frame" style="display:none" id="decFrame"><canvas id="cv" width="360" height="360"></canvas></div></div>
    <div class="kv" id="decInfo"></div>
    <p class="hint">支持手机实拍（含中心 logo / 绿色徽标 / 轻微旋转）。本页专注葵花码；
      标准二维码解码见 Python 版 <code>wxcode_decoder.py</code>。</p>
  </section>

  <section style="grid-column:1/-1">
    <h2>③ 自测（编码 → 栅格化 → 解码，全流程在浏览器内完成）</h2>
    <div class="row"><button id="btnSelf">运行自测</button>
      <span class="hint">编码 → 栅格化 → 解码，全流程在此页面内完成，不联网。</span></div>
    <pre id="selfOut">点击“运行自测”。</pre>
  </section>
</main>

function stage1(s) {

const $ = id => document.getElementById(id);
let lastSVG = null;
let centerHref = null;          // data URI of the uploaded centre image (png/jpg/gif/webp)

function svgForPreview(svg) {   // add a viewBox so the square scales instead of clipping
  return svg.replace('<svg ', '<svg viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" ');
}
function render() {
  const payload = $('payload').value;
  const versionOpt = parseInt($('optVersion').value, 10);
  const minLevel = parseInt($('optLevel').value, 10);
  try {
    const r = WX.encode(payload, { versionOpt: versionOpt, minLevel: minLevel,
                                   badgeHref: BADGE, centerHref: centerHref });
    lastSVG = r.svg;
    $('encPrev').innerHTML = svgForPreview(r.svg);
    setKV($('encInfo'), [
      ['版本 / 纠错', 'v' + r.version + ' / ' + 'LMQH'[r.level]],
      ['掩码', r.mask + '（typebits=' + r.typebits + '）'],
      ['模式', r.mode === 1 ? 'NUMERIC' : r.mode === 2 ? 'ALPHANUMERIC' : 'BYTE (ECI 26)'],
      ['变换后文本', esc(r.mode === 2 ? r.text : '—')],
      ['码字', r.codewords.length + '（' + (r.codewords.length - r.ecpb) + ' 数据 + ' + r.ecpb + ' 纠错）'],
      ['载荷', esc(payload)],
      ['中心图', centerHref ? '已设置（圆形裁剪 r=130）' : '无'],
    ]);
  } catch (e) {
    $('encPrev').innerHTML = '';
    $('encInfo').innerHTML = '<div class="k">错误</div><div class="v err">' + esc(e.message) + '</div>';
  }
}

function setKV(el, pairs) {
  el.innerHTML = pairs.map(([k, v]) => '<div class="k">' + k + '</div><div class="v">' + v + '</div>').join('');
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

$('btnEnc').onclick = render;
$('optVersion').onchange = render;
$('optLevel').onchange = render;

$('btnLogo').onclick = () => $('logoFile').click();
$('logoFile').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    centerHref = fr.result;
    $('logoHint').textContent = f.name + '（' + (f.type || 'image') + '，已嵌入，GIF 会动）';
    render();
  };
  fr.readAsDataURL(f);
};
$('btnLogoClear').onclick = () => {
  centerHref = null;
  $('logoFile').value = '';
  $('logoHint').textContent = '未设置（可选，会盖在中心，圆形裁剪）';
  render();
};

$('btnSvg').onclick = () => {
  if (!lastSVG) { $('btnEnc').click(); }
  const blob = new Blob([lastSVG], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'wxcode.svg'; a.click();
};

$('btnPng').onclick = () => {
  if (!lastSVG) { $('btnEnc').click(); }
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = c.height = 900;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, 900, 900);
    g.drawImage(img, 0, 0, 900, 900);
    c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b);
                    a.download = 'wxcode.png'; a.click(); });
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(lastSVG)));
};

function decodeCanvas() {
  const cv = $('cv');
  const g = cv.getContext('2d', { willReadFrequently: true });
  const img = g.getImageData(0, 0, cv.width, cv.height);
  try {
    const r = WX.decodeImageData(img);
    setKV($('decInfo'), [
      ['码型', '<span class="ok">' + r.family + '</span>'],
      ['版本 / 纠错', 'v' + r.version + ' / ' + r.ec_level],
      ['掩码', r.mask + '（typebits=' + r.typebits + '）'],
      ['模式 / 计数', r.mode + ' / ' + r.count],
      ['QR 内文本', esc(r.qr_text || '—')],
      ['纠错数', String(r.corrections)],
      ['<b>载荷</b>', '<b class="ok">' + esc(r.payload) + '</b>'],
    ]);
  } catch (e) {
    setKV($('decInfo'), [['错误', '<span class="err">' + esc(e.message) + '</span>']]);
  }
}

function loadImageFile(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const maxSide = 900;
    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
    const cv = $('cv');
    cv.width = Math.round(img.width * scale);
    cv.height = Math.round(img.height * scale);
    $('decFrame').style.display = 'block';
    $('cv').style.display = 'block';
    const g = cv.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
    g.drawImage(img, 0, 0, cv.width, cv.height);
    decodeCanvas();
  };
  img.src = url;
}

$('drop').onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) loadImageFile(e.target.files[0]); };
['dragover', 'dragenter'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('hot'); }));
['dragleave', 'drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('hot'); }));
$('drop').addEventListener('drop', e => { if (e.dataTransfer.files[0]) loadImageFile(e.dataTransfer.files[0]); });

$('btnDemo').onclick = () => {
  const r = WX.encode('https://example.com/', { badgeHref: BADGE });
  const img = new Image();
  img.onload = () => {
    const cv = $('cv');
    cv.width = cv.height = 600;
    $('decFrame').style.display = 'block';
    $('cv').style.display = 'block';
    const g = cv.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#fff'; g.fillRect(0, 0, 600, 600);
    g.drawImage(img, 0, 0, 600, 600);
    decodeCanvas();
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(r.svg)));
};

$('btnSelf').onclick = () => {
  const cases = ['abc', '12345', 'hello world', 'https://example.com/', '中文测试',
                 '019823746512398471623', 'https://example.com/aaaaaaaaaaaaaaaaaaaa'];
  const lines = [];
  let ok = 0;
  for (const p of cases) {
    try {
      const enc = WX.encode(p, { badgeHref: BADGE });
      const ras = WX.rasterize(enc.grid, 600);
      const dec = WX.decodeGray(ras.bin, ras.w, ras.h);
      const good = dec.payload === p;
      ok += good ? 1 : 0;
      lines.push((good ? 'PASS' : 'FAIL') + '  v' + enc.version + '/' + 'LMQH'[enc.level] + '/m' + enc.mask +
                 '  ' + p + (good ? '' : '  -> ' + dec.payload));
    } catch (e) {
      lines.push('FAIL  ' + p + '  ' + e.message);
    }
  }
  lines.push('', ok + '/' + cases.length + ' passed');
  $('selfOut').textContent = lines.join('\n');
};
$('btnEnc').click();
</script>
</body>
</html>
