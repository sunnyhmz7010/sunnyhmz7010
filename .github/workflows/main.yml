name: Update README cards

permissions:
  contents: write

on:
  schedule:
    - cron: "0 2 * * *" 
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create dist directory
        run: mkdir -p dist

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show=reviews,discussions_started,discussions_answered,prs_merged,prs_merged_percentage&show_icons=true&theme=ambient_gradient&locale=cn
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=ambient_gradient&locale=cn&stats_format=bytes
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card (wenqu-chinese-learning-platform)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Ryrant&repo=wenqu-chinese-learning-platform&show_owner=true&show=prs_authored,prs_commented,prs_reviewed,issues_authored,issues_commented
          path: dist/pin-wenqu-chinese-learning-platform.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card (telegram-bot-api-file-streaming)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=sunnyhmz7010&repo=telegram-bot-api-file-streaming&show_owner=true&show=prs_authored,prs_commented,prs_reviewed,issues_authored,issues_commented
          path: dist/pin-telegram-bot-api-file-streaming.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card (halo-plugin-schedule-calendar)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=sunnyhmz7010&repo=halo-plugin-schedule-calendar&show_owner=true&show=prs_authored,prs_commented,prs_reviewed,issues_authored,issues_commented
          path: dist/pin-halo-plugin-schedule-calendar.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card (mmwx-probe-komari-theme-adapter)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=sunnyhmz7010&repo=mmwx-probe-komari-theme-adapter&show_owner=true&show=prs_authored,prs_commented,prs_reviewed,issues_authored,issues_commented
          path: dist/pin-mmwx-probe-komari-theme-adapter.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card (SeekMeow)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=sunnyhmz7010&repo=SeekMeow&show_owner=true&show=prs_authored,prs_commented,prs_reviewed,issues_authored,issues_commented
          path: dist/pin-SeekMeow.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
